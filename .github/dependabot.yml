version: 2
updates:
  # Keeps the SHA-pinned actions current (Dependabot updates the SHA and the version comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies in app/uv.lock
  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Digest-pinned base images in app/Dockerfile
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # Python 3.12 -> 3.13+ is a deliberate upgrade (ADR + tests), not a bot PR.
      # Digest updates for 3.12-slim (Debian security fixes) still come through.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
